<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Black Studio</title>
<meta name="description" content="Vintage Black Studio — Bursa, Nilüfer'de dövme stüdyosu. Kaderini seç: iki kapıdan birinden geç.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Manufacturing+Consent&display=swap" rel="stylesheet">
<style>
:root{--black:#050507;--cream:#F4F5F8;--display:"Anton","Arial Narrow",Impact,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--alt:"Manufacturing Consent","Old English Text MT",Georgia,serif;--g:clamp(14px,1.3vw,22px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--cream);overflow:hidden;font-family:var(--mono);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;transition:opacity .5s}
.go .ui{opacity:0}
.mark{position:absolute;left:var(--g);top:12px;font-family:var(--display);font-size:clamp(38px,3vw,48px);line-height:1;letter-spacing:-.02em;height:clamp(40px,3.1vw,50px);display:flex;align-items:center}
.mark i{font-family:var(--alt);font-style:normal;font-size:1.3em;display:inline-block;transform:translateY(.03em) scaleX(.725);margin-left:-.1em}
.head{position:absolute;left:0;right:0;top:clamp(58px,9svh,96px);text-align:center;padding:0 var(--g)}
.head small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6.4vw,92px);line-height:.95;letter-spacing:.012em;margin:10px 0 0;text-transform:uppercase}
.head h1 span{display:inline-block;overflow:hidden;vertical-align:top;padding-top:.2em;margin-top:-.2em}
.head h1 span b{display:inline-block;font-weight:400;transform:translateY(110%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.rdy .head h1 span b{transform:none}
.door{position:absolute;pointer-events:auto;display:block;color:inherit;text-decoration:none;outline:0;-webkit-tap-highlight-color:transparent;cursor:pointer}
.door span{position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:clamp(10px,2svh,22px);text-align:center;white-space:nowrap;transition:opacity .5s,letter-spacing .6s cubic-bezier(.2,.8,.2,1)}
.door em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;opacity:.65}
.door strong{display:block;font-family:var(--display);font-weight:400;font-size:clamp(20px,2.5vw,38px);letter-spacing:.04em;margin-top:4px}
.door:hover span,.door:focus-visible span{letter-spacing:.06em}
.door:focus-visible{box-shadow:0 0 0 1px var(--cream)}
.dim{opacity:.38}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.veil{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .45s linear}
/* WebGL yoksa: sade iki kapı */
.nogl canvas{display:none}
.nogl .door{border:1px solid rgba(244,245,248,.5);border-bottom:0;border-radius:999px 999px 0 0}
.nogl .door:first-of-type{background:radial-gradient(90% 60% at 50% 22%,#F4F5F8 0,#8e8f96 38%,#1b1c22 100%)}
.nogl .door:last-of-type{background:radial-gradient(90% 55% at 50% 100%,#c9cad0 0,#3a3b44 30%,#050507 78%)}
@media(max-width:560px){.hint{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <div class="mark" aria-label="Vintage Black Studio"><span aria-hidden="true">V<i>B</i></span></div>
  <div class="head"><small lang="en">Vintage Black Studio · Est. 2022</small><h1 aria-label="Kaderini seç"><span><b>KADERİNİ</b></span> <span><b>SEÇ</b></span></h1></div>
  <a class="door" id="dL" href="v2/" data-k="cennet"><span><em>KAPI I</em><strong>CENNET</strong></span></a>
  <a class="door" id="dR" href="v1/" data-k="cehennem"><span><em>KAPI II</em><strong>CEHENNEM</strong></span></a>
  <div class="hint">Bir kapıdan geç</div>
</div>
<div class="veil" id="veil"></div>

<script id="fs" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 uRes,uMouse,uOpen,uHov;
uniform float uT,uZ,uSide,uCx,uW,uLF;
const float YB=-0.74;const float YT=0.12;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
float archD(vec2 q,float w){return q.y<YT?max(abs(q.x)-w,YB-q.y):length(vec2(q.x,q.y-YT))-w;}
// oyma çizgisi: çizgi kalınlığı tona göre açılır (ton=ışık)
float hatch(float v,float t){float a=abs(fract(v)-.5)*2.,aa=clamp(fwidth(v)*1.6,.02,.6);return (1.-smoothstep(t-aa,t+aa,a))*step(.015,t);}
void main(){
  vec2 p0=(gl_FragCoord.xy-.5*uRes)/(.5*uRes.y);
  float e=uZ*uZ*(3.-2.*uZ);
  vec2 cT=vec2(uSide*uCx,uSide<0.?YT+uW*.1:YB+.34);
  vec2 p=cT*e+p0*mix(1.,.06,e)+uMouse*.014*(1.-e);
  float side=p.x<0.?-1.:1.;
  vec2 q=p-vec2(side*uCx,0.);
  float T=0.,v=0.,tint=0.;
  if(side<0.){ // ---------- CENNET
    float d=archD(q,uW),op=uOpen.x,hv=uHov.x;
    if(d<0.){
      float ax=abs(q.x);
      if(ax>uW*op){ // kapı kanadı
        float lx=(ax-uW*op)/(uW*(1.-op)+.001);
        float pan=step(.1,abs(fract(q.y*2.3+.15)-.5))*step(.14,abs(lx-.5));
        T=.16+.1*pan+.5*exp(-lx*5.)*(.45+.55*hv);v=q.x*uLF;
      }else{
        vec2 s=vec2(0.,YT+uW*.15),r=q-s;float len=length(r),ang=atan(r.x,-r.y);
        float rays=.5+.5*sin(ang*24.+noise(vec2(ang*4.,uT*.12))*5.);
        float glow=exp(-len*2.1);
        float cl=fbm(vec2(q.x*4.+uT*.025,q.y*7.-uT*.01)),cm=smoothstep(.42,.7,cl)*smoothstep(.05,-.45,q.y);
        T=(.4+.55*glow+.2*rays*(1.-.5*glow))*(.72+.4*hv);
        v=ang*34.+len*5.;
        if(cm>.5){T=max(T,.82);v=q.y*uLF+sin(q.x*16.+cl*7.)*1.4;}
        tint=1.;
      }
    }else{
      float fw=uW*.2;
      if(d<fw){ // taş kemer
        float blk=q.y>YT?abs(fract(atan(q.x,q.y-YT)*3.2)-.5):abs(fract(q.y*4.2)-.5);
        T=(.3+.34*exp(-d*13.)*(.6+.6*hv))*(.5+.5*smoothstep(.02,.07,blk));v=d*uLF;
      }else if(q.y<YB){ // basamaklar
        float yy=YB-q.y,hw=uW*(1.2+yy*1.5);
        if(abs(q.x)<hw){T=(.1+.55*exp(-yy*2.3)*exp(-abs(q.x)/(uW*1.25))*(.55+.65*hv))*(.5+.5*step(.4,fract(yy*10.)));v=p.y*uLF;}
        else{T=.012+.05*fbm(p*5.)*exp(-yy*1.5);v=p.y*uLF+fbm(p*2.5)*2.;}
      }else{ // duvar
        T=.012+.3*exp(-d*3.4)*(.5+.75*hv)*(.75+.5*fbm(p*5.));v=p.y*uLF+fbm(p*2.5)*2.;
      }
    }
  }else{ // ---------- CEHENNEM
    float flick=.86+.14*sin(uT*6.3+noise(vec2(uT*2.,3.))*6.);
    float d=archD(q,uW)+(fbm(q*5.+3.)-.5)*.11,op=uOpen.y,hv=uHov.y;
    if(d<0.){
      float ax=abs(q.x);
      if(ax>uW*op){
        float lx=(ax-uW*op)/(uW*(1.-op)+.001);
        float riv=step(.1,length(fract(vec2(lx*2.,q.y*5.))-.5));
        T=.05+.05*riv+.55*exp(-lx*6.)*flick*(.35+.65*hv);v=q.x*uLF;
      }else{
        float fl=fbm(vec2(q.x*4.5,q.y*2.6-uT*.85)+fbm(q*3.-uT*.3));
        float hg=(q.y-YB)/(.5+.55*hv);
        float F=smoothstep(.12,.72,fl*1.3-hg+.4*(1.-ax/uW));
        T=(.02+.95*F+.14*exp(-(q.y-YB)*3.))*flick;v=(q.x+(fl-.5)*.16)*uLF*.9;tint=F;
      }
    }else{
      float dd=max(d,0.);
      T=.008+.34*exp(-dd*5.5)*flick*(.4+.8*hv)*(.4+1.*fbm(p*4.));
      if(q.y<YB)T+=.2*exp(-(YB-q.y)*5.)*exp(-abs(q.x)/(uW*1.4))*flick*(.5+hv);
      v=(p.x*.6+p.y)*uLF*.85+fbm(p*3.)*3.;
    }
  }
  T*=smoothstep(.0,.16,abs(p.x));                      // iki dünya arasındaki karanlık
  T*=1.-.4*dot(p0*vec2(.42,.7),p0*vec2(.42,.7));       // vinyet
  vec2 dm=p-(uMouse+cT*e);T+=.14*exp(-dot(dm,dm)*7.)*(1.-e); // imleç feneri
  float wo=smoothstep(.5,1.,uZ);
  T=mix(T,uSide<0.?1.25:0.,wo);
  float t=clamp(T,0.,1.);
  float m=hatch(v,t*1.04);
  if(t>.55)m=max(m,hatch((p.x-p.y)*.7*uLF,(t-.55)*2.1));
  vec3 cream=vec3(.957,.961,.973);
  vec3 col=cream*m;
  if(side<0.)col*=mix(vec3(1.),vec3(1.,.97,.9),tint*uHov.x*.7);
  else col*=mix(vec3(1.),vec3(1.,.7,.52),tint*(.15+.5*uHov.y));
  gl_FragColor=vec4(col,1.);
}
</script>
<script>
(function(){
  var body=document.body,cv=document.getElementById('c'),veil=document.getElementById('veil'),
      dL=document.getElementById('dL'),dR=document.getElementById('dR'),YB=-.74,YT=.12,
      st={hov:[0,0],open:[.13,.13],thov:[0,0],z:0,side:-1,mx:0,my:0,tmx:0,tmy:0,going:0,t0:0},
      asp=1,cx=.5,w=.3,gl=null,U={},red=matchMedia('(prefers-reduced-motion:reduce)').matches;

  function layout(){var W=innerWidth,H=innerHeight;asp=W/H;w=Math.min(.34,asp*.36);cx=Math.max(asp*.5,w+.04);
    [[dL,-1],[dR,1]].forEach(function(a){var l=(a[1]*cx-w+asp)/(2*asp)*100,wd=w/asp*100,top=(1-(YT+w+1)/2)*100,bot=(YB+1)/2*100;
      a[0].style.cssText='left:'+l+'%;width:'+wd+'%;top:'+top+'%;bottom:'+bot+'%'});
    if(gl){var d=Math.min(devicePixelRatio||1,W<760?1.5:1.75);cv.width=Math.round(W*d);cv.height=Math.round(H*d);gl.viewport(0,0,cv.width,cv.height);U.px=5.2*d}}

  function initGL(){try{gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});if(!gl)return 0;
      if(!gl.getExtension('OES_standard_derivatives'))return 0;
      function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
      var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw gl.getProgramInfoLog(pr);gl.useProgram(pr);
      var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      var loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      ['uRes','uMouse','uOpen','uHov','uT','uZ','uSide','uCx','uW','uLF'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n)});return 1
    }catch(e){if(window.console)console.warn(e);gl=null;return 0}}

  function frame(t){requestAnimationFrame(frame);if(!gl)return;if(!st.t0)st.t0=t;var k=.09;
    for(var i=0;i<2;i++){st.hov[i]+=(st.thov[i]-st.hov[i])*k;st.open[i]+=((st.thov[i]>0?1:.13)-st.open[i])*(k*.8)}
    st.mx+=(st.tmx-st.mx)*.07;st.my+=(st.tmy-st.my)*.07;
    if(st.going){var z=Math.min(1,(t-st.going)/1900);st.z=z;if(z>.72)veil.style.opacity=1;if(z>=1&&st.going>0){var h=st.href;st.going=-1;location.href=h}}
    gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform2f(U.uMouse,st.mx,st.my);gl.uniform2f(U.uOpen,st.open[0],st.open[1]);gl.uniform2f(U.uHov,st.hov[0],st.hov[1]);
    gl.uniform1f(U.uT,(t-st.t0)/1000);gl.uniform1f(U.uZ,st.z);gl.uniform1f(U.uSide,st.side);gl.uniform1f(U.uCx,cx);gl.uniform1f(U.uW,w);gl.uniform1f(U.uLF,cv.height*.5/U.px);
    gl.drawArrays(gl.TRIANGLES,0,3)}

  function hover(i,on){if(st.going)return;st.thov[i]=on?1:0;st.thov[1-i]=on?0:st.thov[1-i];
    dL.classList.toggle('dim',st.thov[1]>0);dR.classList.toggle('dim',st.thov[0]>0)}
  function choose(a,i,ev){if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button)return;ev.preventDefault();if(st.going)return;
    try{sessionStorage.setItem('vbs-gate',a.dataset.k)}catch(e){}
    st.href=a.getAttribute('href');st.side=i?1:-1;st.thov=[i?0:1,i?1:0];veil.style.background=i?'#000':'#F4F5F8';body.classList.add('go');
    if(!gl||red){veil.style.opacity=1;setTimeout(function(){location.href=st.href},gl?450:250);return}
    setTimeout(function(){st.going=performance.now()},st.hov[i]>.6?60:420)}

  [[dL,0],[dR,1]].forEach(function(a){var el=a[0],i=a[1];
    el.addEventListener('pointerenter',function(e){if(e.pointerType!=='touch')hover(i,1)});el.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch')hover(i,0)});
    el.addEventListener('focus',function(){hover(i,1)});el.addEventListener('blur',function(){hover(i,0)});
    el.addEventListener('click',function(e){choose(el,i,e)})});
  addEventListener('pointermove',function(e){st.tmx=(e.clientX/innerWidth*2-1)*asp;st.tmy=-(e.clientY/innerHeight*2-1)},{passive:true});
  addEventListener('resize',layout);
  addEventListener('pageshow',function(e){if(e.persisted){st.going=0;st.z=0;st.thov=[0,0];veil.style.opacity=0;body.classList.remove('go');dL.classList.remove('dim');dR.classList.remove('dim')}});
  if(!initGL())body.classList.add('nogl');
  layout();requestAnimationFrame(frame);setTimeout(function(){body.classList.add('rdy')},60);
})();
</script>
</body>
</html>
