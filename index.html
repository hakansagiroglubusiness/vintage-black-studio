<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Black Studio</title>
<meta name="description" content="Vintage Black Studio — Bursa, Nilüfer'de dövme stüdyosu. Kaderini seç: iki kapıdan birinden geç.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Manufacturing+Consent&display=swap" rel="stylesheet">
<style>
:root{--black:#050507;--cream:#F4F5F8;--display:"Anton","Arial Narrow",Impact,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--alt:"Manufacturing Consent","Old English Text MT",Georgia,serif;--g:clamp(14px,1.3vw,22px);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--cream);overflow:hidden;font-family:var(--mono);-webkit-font-smoothing:antialiased}

/* sahne: gravür + ışık katmanları. .zoom kapıya doğru büyür, .par imleçle hafifçe kayar */
.zoom,.par{position:fixed;inset:0}
.par{transform:scale(1.05);will-change:transform;opacity:0;transition:opacity 1.6s ease}
.rdy .par{opacity:1}
.par img{position:absolute;left:var(--ox);top:var(--oy);width:var(--dw);height:var(--dh);max-width:none;display:block;filter:brightness(.82) contrast(1.06);transition:filter 1s var(--ease)}
.hov .par img{filter:brightness(.9) contrast(1.08)}
.glow,.rays{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:0;transition:opacity .9s var(--ease);pointer-events:none}
.glow--h{left:var(--hx);top:var(--hy);width:calc(var(--hr)*2.6);height:calc(var(--hr)*3.4);background:radial-gradient(closest-side,rgba(255,252,240,.95),rgba(255,246,222,.55) 34%,rgba(255,240,205,.16) 62%,transparent 78%)}
.rays{left:var(--hx);top:var(--hy);width:calc(var(--hr)*9);height:calc(var(--hr)*9);
  background:repeating-conic-gradient(from 0deg,transparent 0 5deg,rgba(255,248,228,.3) 6.5deg,transparent 9deg 14deg,rgba(255,248,228,.18) 15deg,transparent 17deg 23deg);
  -webkit-mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 34%,transparent 72%);mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 34%,transparent 72%);animation:spin 90s linear infinite}
.glow--e{left:var(--ex);top:var(--ey);width:calc(var(--er)*3.2);height:calc(var(--er)*3.4);background:radial-gradient(closest-side,rgba(255,170,80,.95),rgba(255,96,30,.6) 36%,rgba(170,26,6,.24) 64%,transparent 80%);animation:flick 2.6s ease-in-out infinite}
.glow--h,.glow--e{opacity:.16}
.hl .glow--h{opacity:.92}.hl .rays{opacity:.9}.hr .glow--e{opacity:.95}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes flick{0%,100%{filter:brightness(1)}18%{filter:brightness(.78)}34%{filter:brightness(1.12)}52%{filter:brightness(.86)}71%{filter:brightness(1.06)}86%{filter:brightness(.8)}}
.shade{position:absolute;inset:-6%;pointer-events:none;opacity:0;transition:opacity .9s var(--ease)}
.shade--v{opacity:1;background:radial-gradient(120% 95% at 50% 46%,transparent 42%,rgba(0,0,0,.6) 100%),linear-gradient(180deg,rgba(5,5,7,.55) 0,transparent 30%,transparent 68%,rgba(5,5,7,.7) 100%)}
.shade--r{background:linear-gradient(90deg,transparent 38%,rgba(0,0,0,.78) 66%)}
.shade--l{background:linear-gradient(270deg,transparent 38%,rgba(0,0,0,.78) 66%)}
.hl .shade--r,.hr .shade--l{opacity:1}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
/* geçiş */
.go .glow--h,.go .glow--e{opacity:1!important}
#smoke{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* açılışta arkamızdan çıkıp karşıdaki dağlara doğru küçülerek uçan yaratık */
#fly{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fly .cr{position:absolute;left:0;top:0;width:400px;height:297px;margin:-120px 0 0 -200px;perspective:900px;will-change:transform,opacity;opacity:0}
#fly .cr i{position:absolute;top:0;width:50%;height:100%;background:url(gates/creature.webp) 0 0/200% 100% no-repeat;filter:brightness(.86) contrast(1.08);animation:flapL .58s ease-in-out infinite alternate;backface-visibility:hidden}
#fly .cr .l{left:0;transform-origin:100% 40%}
#fly .cr .r{right:0;background-position:100% 0;transform-origin:0 40%;animation-name:flapR}
@keyframes flapL{from{transform:rotateY(-10deg)}to{transform:rotateY(50deg)}}
@keyframes flapR{from{transform:rotateY(10deg)}to{transform:rotateY(-50deg)}}

/* arayüz */
.ui{position:fixed;inset:0;transition:opacity .5s}
.go .ui{opacity:0;pointer-events:none}
.mark{position:absolute;left:var(--g);top:12px;font-family:var(--display);font-size:clamp(38px,3vw,48px);line-height:1;letter-spacing:-.02em;height:clamp(40px,3.1vw,50px);display:flex;align-items:center;pointer-events:none}
.mark i{font-family:var(--alt);font-style:normal;font-size:1.3em;display:inline-block;transform:translateY(.03em) scaleX(.725);margin-left:-.1em}
.head{position:absolute;left:0;right:0;top:clamp(54px,8.5svh,92px);text-align:center;padding:0 var(--g);pointer-events:none;text-shadow:0 2px 26px rgba(0,0,0,.85)}
.head small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6.2vw,90px);line-height:.95;letter-spacing:.012em;margin:10px 0 0;text-transform:uppercase}
.head h1 span{display:inline-block;overflow:hidden;vertical-align:top;padding-top:.2em;margin-top:-.2em}
.head h1 span b{display:inline-block;font-weight:400;transform:translateY(110%);transition:transform 1.2s var(--ease) .5s}
.rdy .head h1 span b{transform:none}
.door{position:absolute;top:0;bottom:0;width:50%;display:block;color:inherit;text-decoration:none;outline:0;-webkit-tap-highlight-color:transparent;cursor:pointer}
#dL{left:0}#dR{right:0}
.door span{position:absolute;bottom:clamp(18px,4.5svh,44px);white-space:nowrap;transition:opacity .6s,transform .8s var(--ease);text-shadow:0 2px 22px rgba(0,0,0,.9)}
#dL span{left:var(--g);text-align:left}#dR span{right:var(--g);text-align:right}
.door em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;opacity:.7}
.door strong{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,54px);letter-spacing:.03em;margin-top:4px;line-height:1}
.door u{display:block;text-decoration:none;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .7s var(--ease)}
.door:hover u,.door:focus-visible u{opacity:.8;transform:none}
.door:focus-visible strong{text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
.hl #dR span,.hr #dL span{opacity:.35}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;pointer-events:none;text-shadow:0 2px 14px #000}
@media(max-width:700px){.hint{display:none}.door u{display:none}}
@media(prefers-reduced-motion:reduce){.rays,.glow--e{animation:none}}
</style>
</head>
<body>
<div class="zoom" id="zoom"><div class="par" id="par">
  <img id="art" alt="Gustave Doré tarzında bir gravür: solda ışık saçan cennet kapısı ve melekler, sağda alevler içinde cehennem ağzı ve iblisler; önde yol ayrımında duran cübbeli yolcular." decoding="async">
  <div class="rays"></div><div class="glow glow--h"></div><div class="glow glow--e"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="shade shade--v"></div><div class="shade shade--l"></div><div class="shade shade--r"></div>
</div></div>
<div id="fly" aria-hidden="true"></div>
<div class="ui">
  <a class="door" id="dL" href="v2/" data-k="cennet"><span><em>KAPI I</em><strong>CENNET</strong><u>İçeri gir</u></span></a>
  <a class="door" id="dR" href="v1/" data-k="cehennem"><span><em>KAPI II</em><strong>CEHENNEM</strong><u>İçeri gir</u></span></a>
  <div class="mark" aria-label="Vintage Black Studio"><span aria-hidden="true">V<i>B</i></span></div>
  <div class="head"><small lang="en">Vintage Black Studio · Est. 2022</small><h1 aria-label="Kaderini seç"><span><b>KADERİNİ</b></span> <span><b>SEÇ</b></span></h1></div>
  <div class="hint">Bir kapı seç</div>
</div>
<canvas id="smoke" aria-hidden="true"></canvas>

<script>
(function(){
  // Görsel ölçüleri ve kapıların görsel içindeki yeri (0-1). h_: cennet, e_: cehennem; üçüncü değer yarıçap (yüksekliğe oranla)
  var ART={land:{src:'gates/land.jpg',hi:'gates/land-4k.jpg',w:2016,h:1129,h_:[.14,.27,.085],e_:[.84,.44,.1],m_:[.52,.455],Z:7},
           port:{src:'gates/port.jpg',hi:'gates/port-4k.jpg',w:1128,h:2014,h_:[.23,.43,.075],e_:[.76,.55,.085],m_:[.5,.3],Z:4.6}};
  var body=document.body,root=document.documentElement,zoom=document.getElementById('zoom'),par=document.getElementById('par'),art=document.getElementById('art'),
      sm=document.getElementById('smoke'),sx=sm.getContext('2d'),dL=document.getElementById('dL'),dR=document.getElementById('dR'),fx=document.getElementById('fx'),cx=fx.getContext('2d'),
      red=matchMedia('(prefers-reduced-motion:reduce)').matches,cur=null,G={},B={},gz=null,going=0,hov=-1,mx=0,my=0,tx=0,ty=0,P=[],last=0;

  // yerleşim: görsel ekranı kaplar; z>1 iken (cx,cy) noktası sabit kalacak şekilde büyütülür.
  // Büyütme ölçek dönüşümüyle değil boyutla yapılır: tarayıcı her karede kaynaktan yeniden çizer, görüntü bozulmaz.
  function apply(z,cxp,cyp){var a=cur,ox=cxp-(cxp-B.ox)*z,oy=cyp-(cyp-B.oy)*z,dw=B.dw*z,dh=B.dh*z;
    G={hx:ox+a.h_[0]*dw,hy:oy+a.h_[1]*dh,hr:a.h_[2]*dh,ex:ox+a.e_[0]*dw,ey:oy+a.e_[1]*dh,er:a.e_[2]*dh,mx:ox+a.m_[0]*dw,my:oy+a.m_[1]*dh,W:B.W,H:B.H};
    var st=root.style;st.setProperty('--ox',ox+'px');st.setProperty('--oy',oy+'px');st.setProperty('--dw',dw+'px');st.setProperty('--dh',dh+'px');
    ['hx','hy','hr','ex','ey','er'].forEach(function(k){st.setProperty('--'+k,G[k]+'px')})}
  function layout(){var W=innerWidth,H=innerHeight,a=W/H<1.05?ART.port:ART.land;
    if(a!==cur){cur=a;art.src=a.src;hires(a)}
    var s=Math.max(W/a.w,H/a.h),dw=a.w*s,dh=a.h*s;B={ox:(W-dw)/2,oy:(H-dh)/2,dw:dw,dh:dh,W:W,H:H};apply(1,W/2,H/2);
    var d=Math.min(devicePixelRatio||1,1.5);fx.width=Math.round(W*d);fx.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);sm.width=W;sm.height=H}
  // yüksek çözünürlüklü görsel arkadan yüklenir, hazır olunca yerine geçer (yakınlaşmada netlik için)
  function hires(a){setTimeout(function(){var im=new Image();im.onload=function(){if(cur===a&&!going)art.src=im.src};im.src=a.hi},700)}
  // parçacıklar: cehennemden yükselen korlar, cennete süzülen ışık zerreleri
  function spawn(ember){var r=ember?G.er:G.hr,x0=ember?G.ex:G.hx,y0=ember?G.ey:G.hy;
    P.push(ember?{e:1,x:x0+(Math.random()-.5)*r*1.6,y:y0+r*(.2+Math.random()*.6),vx:(Math.random()-.5)*14,vy:-(24+Math.random()*46),l:0,L:1.6+Math.random()*2.2,s:.8+Math.random()*1.7}
                 :{e:0,x:x0+(Math.random()-.5)*r*4.5,y:y0+r*(1+Math.random()*3.5),vx:0,vy:-(8+Math.random()*16),l:0,L:3+Math.random()*3,s:.6+Math.random()*1.3,tx:x0})}
  function frame(t){requestAnimationFrame(frame);var dt=Math.min(.05,(t-last)/1000||0);last=t;
    mx+=(tx-mx)*.06;my+=(ty-my)*.06;if(gz)pass(t);if(CR.length)flyers(t);if(!going)par.style.transform='translate('+(-mx*14).toFixed(2)+'px,'+(-my*10).toFixed(2)+'px) scale(1.05)';
    if(red)return;
    var re=(hov===1?46:9)*dt,rh=(hov===0?30:6)*dt;if(going){re=hov===1?90*dt:0;rh=hov===0?70*dt:0}
    if(Math.random()<re)spawn(1);if(Math.random()<re-1)spawn(1);if(Math.random()<rh)spawn(0);
    cx.clearRect(0,0,G.W,G.H);
    for(var i=P.length-1;i>=0;i--){var p=P[i];p.l+=dt;if(p.l>p.L){P.splice(i,1);continue}
      var k=p.l/p.L,a=Math.sin(Math.PI*k);
      if(p.e){p.vx+=(Math.random()-.5)*40*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.fillStyle='rgba(255,'+Math.round(150-90*k)+','+Math.round(60-50*k)+','+(.9*a).toFixed(3)+')'}
      else{p.x+=(p.tx-p.x)*.25*dt+Math.sin(t/900+p.L*9)*6*dt;p.y+=p.vy*dt;cx.fillStyle='rgba(255,250,232,'+(.75*a).toFixed(3)+')'}
      cx.beginPath();cx.arc(p.x,p.y,p.s*(p.e?1-.5*k:1),0,6.3);cx.fill()}}

  // yaratık: kameranın arkasından (çok büyük ve bulanık) çıkar, karşıdaki dağlara doğru giderek küçülür ve kaybolur.
  // Perspektif: konum, ölçekle birlikte kaçış noktasına yaklaşır.
  var FLY=document.getElementById('fly'),CR=[];
  function release(){if(red||CR.length)return;var W=B.W,H=B.H,m=Math.max(W,H),el=document.createElement('div');el.className='cr';el.innerHTML='<i class="l"></i><i class="r"></i>';FLY.appendChild(el);
    CR.push({el:el,t0:performance.now()+350,D:9500,sx:W*.56,sy:H*1.12,S0:m/400*1.9,S1:m/400*.018,sw:W*.11,ph:1.2})}
  function flyers(t){for(var i=CR.length-1;i>=0;i--){var c=CR[i],u=(t-c.t0)/c.D;if(u<0)continue;if(u>=1){c.el.remove();CR.splice(i,1);continue}
      var d=Math.pow(u,.92),S=c.S0*Math.pow(c.S1/c.S0,d),k=S/c.S0,tx=G.mx,ty=G.my,
        x=tx+(c.sx-tx)*k+Math.sin(u*4.2+c.ph)*c.sw*Math.sqrt(k)*(1-u),y=ty+(c.sy-ty)*k,ang=Math.cos(u*4.2+c.ph)*.16*(1-u);
      c.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+ang.toFixed(3)+'rad) scale('+S.toFixed(4)+')';
      c.el.style.opacity=(Math.min(1,u*12)*Math.min(1,(1-u)*5)).toFixed(3);
      c.el.style.filter=S>1.1?'blur('+Math.min(6,(S-1.1)*2.2).toFixed(1)+'px)':''}}
  function setHov(i){hov=i;body.classList.toggle('hl',i===0);body.classList.toggle('hr',i===1);body.classList.toggle('hov',i>=0)}
  // geçiş: kapıya doğru yakınlaş; sonunda ekran kapının rengine (cennet açık, cehennem siyah) döner ve siteye geçilir
  function pass(t){if(!gz.t0)gz.t0=t;var k=Math.min(1,(t-gz.t0)/2000),W=B.W,H=B.H;
    apply(1+(cur.Z-1)*k*k*k,gz.x,gz.y);
    var f=(k-.62)/.36;f=f<0?0:f>1?1:f;sx.clearRect(0,0,W,H);if(f>0){sx.globalAlpha=f*f*(3-2*f);sx.fillStyle=gz.base;sx.fillRect(0,0,W,H);sx.globalAlpha=1}
    if(k>=1&&!gz.done){gz.done=1;location.href=gz.href}}
  function choose(a,i,ev){if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button)return;ev.preventDefault();if(going)return;going=1;
    try{sessionStorage.setItem('vbs-gate',a.dataset.k)}catch(e){}
    var href=a.getAttribute('href');setHov(i);
    if(red){sx.fillStyle=i?'#000':'#F4F5F8';sx.fillRect(0,0,B.W,B.H);setTimeout(function(){location.href=href},300);return}
    setTimeout(function(){body.classList.add('go');par.style.transform='scale(1.05)';
      gz={x:(i?G.ex:G.hx),y:(i?G.ey:G.hy),href:href,base:i?'#000':'#F4F5F8',t0:0}},340)}

  [[dL,0],[dR,1]].forEach(function(p){var el=p[0],i=p[1];
    el.addEventListener('pointerenter',function(e){if(e.pointerType!=='touch'&&!going)setHov(i)});
    el.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch'&&!going)setHov(-1)});
    el.addEventListener('focus',function(){if(!going)setHov(i)});el.addEventListener('blur',function(){if(!going)setHov(-1)});
    el.addEventListener('click',function(e){choose(el,i,e)})});
  addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1},{passive:true});
  addEventListener('resize',layout);
  addEventListener('pageshow',function(e){if(!e.persisted)return;going=0;gz=null;setHov(-1);body.classList.remove('go');sx.clearRect(0,0,sm.width,sm.height);layout()});
  layout();
  function ready(){if(body.classList.contains('rdy'))return;body.classList.add('rdy');setTimeout(release,500)}
  if(art.complete&&art.naturalWidth)ready();else{art.addEventListener('load',ready);art.addEventListener('error',ready);setTimeout(ready,2500)}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
